<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Form</title>
    <!-- Tailwind CSS CDN for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Style standard Django form inputs injected through form.as_p */
        form p {
            margin-bottom: 1.25rem;
        }
        form label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #d4d4d8;
            margin-bottom: 0.5رم;
            margin-bottom: 0.5rem;
        }
        form input, form textarea, form select {
            width: 100%;
            background-color: #09090b;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            color: #f4f4f5;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }
        form input:focus, form textarea:focus, form select:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2);
        }
        form .helptext {
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 0.25rem;
            display: block;
        }
        form .errorlist {
            list-style: none;
            padding: 0;
            color: #f87171;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- Navbar / Header -->
    <header class="border-b border-zinc-900 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></span>
                <h1 class="text-xl font-bold tracking-wider text-white uppercase">Movie<span class="text-red-600">Hub</span></h1>
            </div>
            <div>
                <a href="{% url 'movie_list' %}" class="text-zinc-400 hover:text-white text-sm font-medium transition">Back to List</a>
            </div>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="max-w-xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <!-- Subtle decorative red ambient glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="mb-8">
                <h2 class="text-2xl font-bold tracking-tight text-white">Movie Details</h2>
                <p class="text-sm text-zinc-400 mt-1">Fill in the information below to save or update the movie entry.</p>
            </div>

            <!-- Django Form -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                {{ form.as_p }}

                <div class="flex items-center justify-end gap-4 pt-4 border-t border-zinc-900 mt-6">
                    <a href="{% url 'movie_list' %}" class="px-5 py-2.5 rounded-lg text-sm font-medium text-zinc-400 hover:text-white hover:bg-zinc-900 transition">Cancel</a>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition duration-200 shadow-lg shadow-red-950/50">
                        Save Movie
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
